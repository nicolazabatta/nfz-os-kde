# Folders under /var/usrlocal (/usr/local links there, see scripts/25-opt-usrlocal.sh).
# /var/opt and /var/usrlocal themselves are created by rpm-ostree-0-integration-opt-usrlocal.conf.
d /var/usrlocal/bin 0755 root root -
d /var/usrlocal/sbin 0755 root root -
d /var/usrlocal/share 0755 root root -
d /var/usrlocal/share/applications 0755 root root -
